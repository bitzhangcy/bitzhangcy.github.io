title: Adrian
tagline: Do Not Go Gentle into That Good Night
description: >-
  Adrian is a Ph.D. candidate in Computer Science at UNSW Canberra,
  with a background in industrial control and research interests in
  large language models, generative AI, and intelligent decision making.
lang: en
locale: en_US
url: https://chunyangzhang.com
baseurl: ""
default_social_image: cover.jpg

owner:
  name: Adrian
  scholarly_name: Chunyang Zhang
  avatar: chunyangzhang.jpg
  bio: Industrial control, language models, and generative AI.
  email: chunyang.zhang@unsw.edu.au
  github: bitzhangcy
  linkedin: bitzhangcy
  scholar: https://scholar.google.com/citations?user=0hXn5p8AAAAJ
  zhihu: https://www.zhihu.com/people/ji-e-de-sheng-shi

links:
  - title: About
    url: /
  - title: Publications
    url: /publications/
  - title: Projects
    url: /projects/
  - title: Readings
    url: /readings/
  - title: Writing
    url: /personal-blogs/


# Load one analytics provider in production; account IDs remain available below.
# Options: google, counter, baidu, or an empty string to disable analytics.
analytics:
  provider: google
  google: G-T5N5JY1E21
  counter: 4c8f7caa-2b55-46cd-a995-2c4633303773
  baidu: bb1dff61b808abda6246f2d171d3c3f7

timezone: Australia/Sydney
future: false
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
kramdown:
  auto_ids: true
  entity_output: as_char
  toc_levels: 2..3

plugins:
  - jekyll-sitemap

# All essays share a template. Publication is controlled per file with published.
defaults:
  - scope:
      path: "blogs"
      type: pages
    values:
      layout: essay
      lang: zh-CN
      locale: zh_CN
      status: complete

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - vendor
  - .bundle
  - .tools
  - scripts
  - _site-preview
  - _site-production
  - node_modules
  - package.json
  - package-lock.json
  - backup
  - tmp
  - .idea
