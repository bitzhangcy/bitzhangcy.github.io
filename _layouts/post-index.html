---
layout: page
---
{{ content }}
<ul class="writing-list">
  {% assign essays = site.pages | where: 'layout', 'essay' | sort: 'date' | reverse %}
  {% for essay in essays %}
  <li class="writing-entry">
    <time datetime="{{ essay.date | date: '%Y' }}">{{ essay.date | date: '%Y' }}</time>
    <h2><a href="{{ essay.url | relative_url }}">{{ essay.title }}</a></h2>
    <p>{{ essay.description }}</p>
  </li>
  {% endfor %}
</ul>
