<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url | escape }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | escape }}">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="{{ page.redirect_to | absolute_url | escape }}">
</head>
<body>
  <main id="main">
    <h1>{{ page.title | escape }}</h1>
    <p><a href="{{ page.redirect_to | relative_url | escape }}">Open Adrian's CV (PDF)</a> if it does not open automatically.</p>
  </main>
</body>
</html>
