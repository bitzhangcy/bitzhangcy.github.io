<div class="navigation-wrapper">
  <div class="navigation-inner">
    <div class="site-name">
      <a href="{{ site.url }}">{{ site.title }}</a>
    </div><!-- /.site-name -->
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">Menu</button>
    {% capture url %}{{ page.url | remove:'index.html' }}{% endcapture %}
    <div class="top-navigation" id="site-navigation">
      <nav aria-label="Primary" itemscope itemtype="http://schema.org/SiteNavigationElement">
        <ul>
          {% for link in site.links %}
          <li><a href="{{ site.url }}{{ link.url }}" {% if url == link.url %}class="top-navigation-current" aria-current="page"{% endif %}>{{ link.title }}</a></li>
          {% endfor %}
        </ul>
      </nav>
    </div><!-- /.top-navigation -->
  </div><!-- /.navigation-inner -->
</div><!-- /.navigation-wrapper -->
